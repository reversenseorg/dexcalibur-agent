# Equivalent to GitHub Actions de Dexcalibur_BuildDxcPro_Web (TeamCity Kotlin DSL)
name: Publish

on:
  release:
    type: ['released']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build'
        required: true
        type: string
      skip_upload:
        description: 'Skip upload'
        required: false
        type: boolean
env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

permissions:
  id-token: write  # Required for OIDC
  contents: write   # Required to upload assets

jobs:
  build:
    name: Build agent libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          scope: '@reversense'
          package-manager-cache: false  # never use caching in release builds
      - name: Install global deps
        run: npm install -g webpack webpack-cli
      - name: Install dependencies
        run: npm install
      - name: Dump npm debug log
        if: failure()
        run: |
          grep -iE 'http fetch .*(401|GET)' /github/home/.npm/_logs/*-debug-0.log | tail -40
          npm config ls -l | grep -iE 'registry|authToken|_auth|always-auth'
      - name: Build code
        run: |
          npm run build
          npm run pack-generic
          npm run pack-x64
          npm run pack-arm64

  github-publish:
    name: Publish as GitHub NPM package
    runs-on: ubuntu-latest
    needs: build
    if: success()
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@reversenseorg'
          package-manager-cache: false  # never use caching in release builds
      - name: Publish to registry
        run: |
          npm pkg set name="@reversenseorg/dexcalibur-agent"
          npm publish --registry=https://npm.pkg.github.com/
  npmjs-publish:
    name: Publish as NPMjs package
    runs-on: ubuntu-latest
    needs: build
    if: success()
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https:/registry.npmjs.org/'
          scope: '@reversense'
          package-manager-cache: false  # never use caching in release builds
      - name: OIDC preflight
        run: |
          echo "npm            : $(npm --version)"
          echo "ID_TOKEN_URL   : ${ACTIONS_ID_TOKEN_REQUEST_URL:-ABSENT}"
          echo "npmjs authToken: $(npm config get //registry.npmjs.org/:_authToken)"
          echo "userconfig     : ${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
      - name: Publish to NPM github registry
        run: |
          npm pkg set name="@reversense/dexcalibur-agent"
          npm publish --registry=https://registry.npmjs.org/

  notify-discord:
    name: Discord notification
    needs: [npmjs-publish,github-publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          
          if [[ "PUBLISH_RESULT" == "success" && "$RELEASE_RESULT" == "success" ]]; then
            STATUS="SUCCESS"; COLOR=$(( 16#2EA043 ))
          elif [[ "$BUILD_RESULT" == "cancelled" || "$RELEASE_RESULT" == "cancelled" ]]; then
            STATUS="CANCELLED"; COLOR=$(( 16#6E7681 ))
          else
            STATUS="FAILED"; COLOR=$(( 16#D73A49 ))
          fi
          
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          
          jq -n \
            --arg title   "Agent:build - ${GITHUB_WORKFLOW} — ${STATUS}" \
            --arg url     "$RUN_URL" \
            --arg branch  "$GITHUB_REF_NAME" \
            --arg sha     "${GITHUB_SHA:0:8}" \
            --arg actor   "$GITHUB_ACTOR" \
            --arg msg     "$(printf '%.200s' "$COMMIT_MSG")" \
            --argjson color "$COLOR" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                description: $msg,
                fields: [
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Commit",  value: $sha,    inline: true},
                  {name: "Author",  value: $actor,  inline: true}
                ],
                timestamp: (now | todate)
              }],
              allowed_mentions: {parse: []}
            }' > payload.json
          
          curl -sS --fail-with-body \
               --retry 5 --retry-delay 2 --retry-all-errors \
               -X POST \
               -H "Content-Type: application/json" \
               -d @payload.json \
               "$DISCORD_WEBHOOK_URL"